<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vi er flyttet – mellemosis.dk</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: #ece6dd;
        color: #2c2c2a;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
      }

      main {
        width: 100%;
        max-width: 640px;
        text-align: center;
      }

      .heart {
        display: block;
        width: 60vw;
        max-width: 260px;
        height: auto;
        margin: 0 auto 32px;
      }

      .message {
        font-size: 24px;
        font-weight: 700;
        line-height: 1.4;
      }

      .message a {
        color: #c8453e;
        text-decoration: underline;
        text-underline-offset: 4px;
        text-decoration-thickness: 2px;
      }

      .message a:hover,
      .message a:focus-visible {
        color: #a3322c;
      }

      @media (min-width: 600px) {
        .message {
          font-size: 32px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="heart" viewBox="0 0 24 22" aria-hidden="true">
        <path
          fill="#d9534a"
          d="M12 21.6 10.3 20C4.2 14.5 0 10.7 0 6.1 0 2.7 2.7 0 6.1 0 8 0 9.9.9 11.1 2.3L12 3.3l.9-1C14.1.9 16 0 17.9 0 21.3 0 24 2.7 24 6.1c0 4.6-4.2 8.4-10.3 13.9L12 21.6Z"
        />
      </svg>
      <p class="message">
        Du er havnet på den gamle hjemmeside.
        <a href="https://mellemosis.dk/">Klik her</a>
        og du bliver straks sendt ind til den nye hjemmeside, der meget snart
        bliver lanceret!
      </p>
    </main>
  </body>
</html>
